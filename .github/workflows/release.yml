name: Release (SDK packages)

on:
  repository_dispatch:
    types: [coordinated-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.16.0-beta.1)'
        required: true
        type: string
      version:
        description: 'Release version without v prefix (e.g. 0.16.0-beta.1)'
        required: true
        type: string
      ref:
        description: 'Git ref to check out. Defaults to tag. Use branch/SHA for dry-run before tag is pushed.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — build only, skip npm publish and CLI smoke'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

env:
  RELEASE_TAG:  ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
  RELEASE_VER:  ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.event.client_payload.tag }}

# ── Job 1: verify ─────────────────────────────────────────────────────────────
# No environment. Runs for dry-run and live.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Show run mode
        run: |
          echo "Tag:          ${{ env.RELEASE_TAG }}"
          echo "Version:      ${{ env.RELEASE_VER }}"
          echo "CheckoutRef:  ${{ env.CHECKOUT_REF }}"
          echo "DryRun:       ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' || 'false' }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify tag matches beta-version.json
        run: node scripts/release-gates.mjs --check-version "${{ env.RELEASE_TAG }}"

      - name: Verify build allowlist (deferred packages excluded)
        run: node scripts/release-gates.mjs --check-build-allowlist

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: node scripts/build-sdk.mjs

# ── Job 2: publish-dry-run ────────────────────────────────────────────────────
# Only runs when dry_run == true. No environment (no tag restriction).
# Proves build works and prints what would be published.
  publish-dry-run:
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: node scripts/build-sdk.mjs

      - name: '[DRY-RUN] Dry run complete'
        run: |
          echo ""
          echo "Dry run complete. Build passed. No environment required."
          node -e "
            const bv = JSON.parse(require('fs').readFileSync('release/beta-version.json','utf-8'));
            console.log('Would verify: @rohinik-org/install-manifest@' + bv.release + ' on npm');
            bv.publishOrder.forEach(p => console.log('Would publish: ' + p + '@' + bv.packages[p] + ' --tag beta --provenance'));
          "
          echo ""
          echo "Ready for live coordinated-release dispatch from RS1."

# ── Job 3: publish ────────────────────────────────────────────────────────────
# Only runs on live path. Uses npm-publish environment.
  publish:
    needs: verify
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm OIDC trusted publish

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify install-manifest on npm
        run: |
          node scripts/release-gates.mjs \
            --check-npm "@rohinik-org/install-manifest" \
            "${{ env.RELEASE_VER }}" beta

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: node scripts/build-sdk.mjs

      - name: Publish SDK packages
        run: node scripts/publish-sdk.mjs --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify all SDK packages on npm
        run: node scripts/release-gates.mjs --check-all-sdk-packages beta

      - name: CLI smoke install
        run: |
          npm install -g @rohinik-org/cli@beta --no-save
          rohinik version
