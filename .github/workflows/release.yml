name: Release (SDK packages)

on:
  repository_dispatch:
    types: [coordinated-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.16.0-beta.1)'
        required: true
        type: string
      version:
        description: 'Release version without v prefix (e.g. 0.16.0-beta.1)'
        required: true
        type: string
      ref:
        description: 'Git ref to check out (branch, SHA, or tag). Defaults to tag. Use branch/SHA for dry-run before tag is pushed.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run — build only, skip npm publish and CLI smoke'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

env:
  RELEASE_TAG:  ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
  RELEASE_VER:  ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref != '' && inputs.ref || inputs.tag) || github.event.client_payload.tag }}
  DRY_RUN:      ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

# ── Job 1: verify ─────────────────────────────────────────────────────────────
# No environment. Runs for both dry-run and live.
# Gates: tag matches beta-version.json, install, build.
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Show run mode
        run: |
          echo "Tag:          ${{ env.RELEASE_TAG }}"
          echo "Version:      ${{ env.RELEASE_VER }}"
          echo "CheckoutRef:  ${{ env.CHECKOUT_REF }}"
          echo "DryRun:       ${{ env.DRY_RUN }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify tag matches beta-version.json
        run: node scripts/release-gates.mjs --check-version "${{ env.RELEASE_TAG }}"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

# ── Job 2: publish ────────────────────────────────────────────────────────────
# Always runs (dry-run and live). Has environment: npm-publish.
# Irreversible steps (npm publish, CLI smoke) gated by DRY_RUN.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm OIDC trusted publish

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # ── Verify install-manifest on npm (skipped in dry-run — RS1 hasn't published yet) ──
      - name: Verify install-manifest on npm
        if: env.DRY_RUN != 'true'
        run: |
          node scripts/release-gates.mjs \
            --check-npm "@rohinik-org/install-manifest" \
            "${{ env.RELEASE_VER }}" beta

      - name: '[DRY-RUN] Skip install-manifest npm check'
        if: env.DRY_RUN == 'true'
        run: echo "[DRY-RUN] Would verify @rohinik-org/install-manifest@${{ env.RELEASE_VER }} on npm"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

      # ── Publish 7 packages (skipped on dry-run) ────────────────────────────
      - name: Publish SDK packages
        if: env.DRY_RUN != 'true'
        run: node scripts/publish-sdk.mjs --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: '[DRY-RUN] Skip SDK package publish'
        if: env.DRY_RUN == 'true'
        run: |
          echo "[DRY-RUN] Would run: node scripts/publish-sdk.mjs --tag beta --provenance"
          node -e "
            const bv = JSON.parse(require('fs').readFileSync('release/beta-version.json','utf-8'));
            bv.publishOrder.forEach(p => console.log('  Would publish: ' + p + '@' + bv.packages[p]));
          "

      # ── Verify all packages on npm (skipped on dry-run) ───────────────────
      - name: Verify all SDK packages on npm
        if: env.DRY_RUN != 'true'
        run: node scripts/release-gates.mjs --check-all-sdk-packages beta

      # ── CLI smoke install (skipped on dry-run) ─────────────────────────────
      - name: CLI smoke install
        if: env.DRY_RUN != 'true'
        run: |
          npm install -g @rohinik-org/cli@beta --no-save
          rohinik version

      - name: '[DRY-RUN] Dry run complete'
        if: env.DRY_RUN == 'true'
        run: |
          echo ""
          echo "Dry run complete. Build passed. npm-publish environment accessible."
          echo "Ready for live coordinated-release dispatch from RS1."
