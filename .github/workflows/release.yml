name: Release (SDK packages)

on:
  repository_dispatch:
    types: [coordinated-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.16.0-beta.1) — must exist in this repo'
        required: true
        type: string
      version:
        description: 'Release version without v prefix (e.g. 0.16.0-beta.1)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — verify gates only, no publish'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.client_payload.tag }}
  RELEASE_VER: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.client_payload.version }}

# ── Job 1: verify ─────────────────────────────────────────────────────────────
# Runs for both dry-run and live. No environment — no secrets needed.
# Gates: tag matches beta-version.json, install-manifest on npm, install, build.
jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Show run mode
        run: |
          echo "Tag:     ${{ env.RELEASE_TAG }}"
          echo "Version: ${{ env.RELEASE_VER }}"
          echo "DryRun:  ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' || 'false' }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify tag matches beta-version.json
        run: node scripts/release-gates.mjs --check-version "${{ env.RELEASE_TAG }}"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

      - name: Dry run complete
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true' }}
        run: |
          echo ""
          echo "Dry run complete. Gates passed: version, build."
          node -e "
            const bv = JSON.parse(require('fs').readFileSync('release/beta-version.json','utf-8'));
            console.log('Would verify: @rohinik-org/install-manifest@' + bv.release + ' on npm');
            bv.publishOrder.forEach(p => console.log('Would publish: ' + p + '@' + bv.packages[p] + ' --tag beta'));
          "

# ── Job 2: publish ────────────────────────────────────────────────────────────
# Runs only on live path. Has environment: npm-publish.
  publish:
    needs: verify
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true') }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # npm OIDC trusted publish

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Verify install-manifest on npm
        run: |
          node scripts/release-gates.mjs \
            --check-npm "@rohinik-org/install-manifest" \
            "${{ env.RELEASE_VER }}" beta

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm -r --sort run build

      - name: Publish SDK packages
        run: node scripts/publish-sdk.mjs --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify all SDK packages on npm
        run: node scripts/release-gates.mjs --check-all-sdk-packages beta

      - name: CLI smoke install
        run: |
          npm install -g @rohinik-org/cli@beta --no-save
          rohinik version
